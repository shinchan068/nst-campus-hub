name: Feature request
description: Suggest a focused change to the Campus Hub.
title: "feat: "
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        To work on an existing issue, comment with `/claim` once it is ready and wait for assignment. Use `/unclaim` to give it back. For the standing profile task, use issue #1 without claiming it.
  - type: textarea
    id: goal
    attributes:
      label: Who needs this and why?
      placeholder: As a student, I want to…
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Proposed behaviour
      description: Describe what would change for the user.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable checks a reviewer can try.
    validations:
      required: true
