name: Bug report
description: Report something that behaves differently from what you expect.
title: "fix: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        To work on an existing issue, comment with `/claim` once it is ready and wait for assignment. Use `/unclaim` to give it back. For the standing profile task, use issue #1 without claiming it.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the page URL and the steps someone else can follow.
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include a screenshot or an error message if it helps. Remove personal information.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome on Android
